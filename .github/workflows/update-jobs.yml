name: Refresh government job postings

on:
  push:
    branches: [main]
    paths:
      - "scripts/update_jobs.py"
      - ".github/workflows/update-jobs.yml"
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: job-feed
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Refresh public government postings
        run: python3 scripts/update_jobs.py

      - name: Save updated feed
        run: |
          if ! git diff --quiet -- jobs.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add jobs.json
            git commit -m "Refresh daily government job feed" -m "Co-authored-by: Copilot <223556219+Copilot@users.noreply.github.com>"
            git push
          fi
