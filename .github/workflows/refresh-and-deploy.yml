name: Refresh jobs and deploy

on:
  schedule:
    - cron: "17 11,23 * * *"   # twice a day, UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "index.html"
      - "app.js"
      - "styles.css"
      - ".github/workflows/**"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run tests
        run: python -m unittest discover -s tests -t . -v

      - name: Refresh postings
        # A failed refresh keeps the last good data/jobs.json, so the site still deploys.
        continue-on-error: true
        run: python -m scripts.govjobs.run

      - name: Commit refreshed data
        run: |
          if ! git diff --quiet -- data/jobs.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/jobs.json
            git commit -m "Refresh government job postings"
            git push
          fi

      - name: Stage site
        run: |
          mkdir _site
          cp index.html styles.css app.js _site/
          cp -r data _site/data

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
